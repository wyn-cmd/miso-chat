<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Miso Chat">
  <meta name="apple-mobile-web-app-title" content="Miso Chat">
  <title>Log in · Miso Chat</title>
  <script src="/static/theme-init.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#020307">
</head>
<body class="centered">
  <button id="themeBtn" class="icon-btn theme-float" type="button" aria-label="Switch to light theme"></button>
  <main class="card">
    <h1>Miso Chat</h1>
    <form id="loginForm" class="stack">
      <label>Username <input id="user" autocomplete="username" required></label>
      <label>Password <input id="pass" type="password" autocomplete="current-password" required></label>
      <label class="inline"><input id="remember" type="checkbox" checked> Keep me signed in on this device</label>
      <button type="submit">Log in</button>
      <p id="err" class="error"></p>
    </form>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
