<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balance · Miso Chat</title>
  <script src="/static/theme-init.js"></script>
  <script src="/static/locales/en.js"></script>
  <script src="/static/i18n.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link id="uiTheme" rel="stylesheet" href="/static/redesign.css">
  <script>try{var rpUi=localStorage.getItem("rp_ui"),rpLook=["classic","moon","lantern","dusk"].indexOf(rpUi)<0?"moon":rpUi;if(rpLook==="classic")document.getElementById("uiTheme").disabled=true;if(rpLook==="moon"||rpLook==="lantern"||rpLook==="dusk"){document.documentElement.dataset.look=rpLook;document.write('<link id="lookSheet" rel="stylesheet" href="/static/'+rpLook+'.css">')}}catch(e){}</script>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <style>
    .balance-main { max-width: 560px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-2xl); }
    .balance-main .card { padding: var(--space-lg); }
    .balance-main h1 { margin: 0 0 var(--space-md); }
    .balance-main .balance-figure { font-size: var(--text-2xl); font-family: var(--font-display); color: var(--color-ink); }
    .balance-req { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs) 0; border-top: 1px solid var(--color-rule); flex-wrap: wrap; }
    .balance-req:first-child { border-top: 0; }
    .balance-req .spacer { flex: 1; }
  </style>
</head>
<body>
  <header>
    <button id="backBtn" class="ghost small" type="button">Back</button>
    <a class="brand" href="/">Miso Chat</a>
    <span id="who" class="muted"></span>
    <span class="spacer"></span>
    <a id="adminLink" href="/admin" hidden>Admin</a>
    <button id="logoutBtn" class="ghost" type="button">Log out</button>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch to light theme"></button>
  </header>
  <main class="balance-main">
    <div class="card">
      <h1>Token balance</h1>
      <p class="muted">Tier: <span id="tier"></span></p>
      <p class="muted">Balance: <span id="balance" class="balance-figure"></span> MCC</p>
      <button id="topupBtn" type="button">Top up</button>
      <p id="msg" class="error" aria-live="polite"></p>
      <section id="adminSection" hidden>
        <h2>Pending requests</h2>
        <div id="reqList"></div>
      </section>
    </div>
  </main>
  <dialog id="topupDlg">
    <form id="topupForm" class="stack">
      <label>Tokens <input id="tTokens" type="number" min="1" required></label>
      <label>Price (MCC) <input id="tPrice" type="number" min="0" step="0.01" required></label>
      <button type="submit">Send request</button>
      <button id="topupCancel" class="ghost" type="button">Cancel</button>
      <p id="topupMsg" class="error" aria-live="polite"></p>
    </form>
  </dialog>
  <script src="/static/common.js"></script>
  <script src="/static/balance.js"></script>
</body>
</html>
